name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  lint:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'

      - name: Run tests
        run: go test -v ./...

      - name: Build dep-fetch
        run: go build -o ./bin/dep-fetch .

      - name: Sync binary deps
        run: ./bin/dep-fetch sync

      - name: Run linter
        run: ./bin/golangci-lint run --timeout=5m ./...
